
name: WorkBuddy Intl Daily

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 08:00（UTC 00:00）
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: workbuddy-intl-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Shanghai
      WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run international daily task
        run: python workbuddy_intl_daily.py

      - name: Persist rotated international tokens
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -f wb_intl_tokens.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wb_intl_tokens.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update international token cache"
              git push
            fi
          fi
